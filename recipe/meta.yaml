{% set version = "1.1-2" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-arrayhelpers
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/arrayhelpers_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/arrayhelpers/arrayhelpers_{{ version }}.tar.gz
  sha256: 1aa628902070ff098cd52ec770f5377aea67ae1bd6f5ffe286dca77e30ffe87d

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-svunit
  run:
    - r-base
    - r-svunit

test:
  commands:
    - $R -e "library('arrayhelpers')"           # [not win]
    - "\"%R%\" -e \"library('arrayhelpers')\""  # [win]

about:
  home: http://arrayhelpers.r-forge.r-project.org/
  license: GPL-2.0-or-later
  summary: Some convenient functions to work with arrays.
  license_family: GPL3
  license_file:
    - '{{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3'

extra:
  recipe-maintainers:
    - conda-forge/r

